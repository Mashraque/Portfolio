<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBook" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgBook)"/>

  <!-- Stylized Open 3D Memory Book -->
  <g transform="translate(400, 220)">
    <!-- Book Back Glow -->
    <ellipse cx="0" cy="50" rx="180" ry="40" fill="#6366f1" opacity="0.2"/>

    <!-- Left Page -->
    <path d="M0,40 C-80,20 -140,30 -160,10 L-160,-70 C-140,-50 -80,-60 0,-40 Z" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <!-- Right Page -->
    <path d="M0,40 C80,20 140,30 160,10 L160,-70 C140,-50 80,-60 0,-40 Z" fill="#3730a3" stroke="#818cf8" stroke-width="2"/>

    <!-- Memory Photo Frame on Left Page -->
    <rect x="-130" y="-40" width="80" height="60" rx="4" fill="#1e1b4b" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(-5)"/>
    <circle cx="-90" cy="-10" r="15" fill="#f43f5e" opacity="0.6"/>

    <!-- Cinemachine Camera Icon on Right Page -->
    <rect x="50" y="-35" width="70" height="50" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" transform="rotate(5)"/>
    <polygon points="120,-10 140,-25 140,5" fill="#38bdf8" transform="rotate(5)"/>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="40" width="170" height="34" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>
  <text x="65" y="62" fill="#a5b4fc" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">BOOK OF US</text>
  <text x="230" y="62" fill="#94a3b8" font-family="monospace" font-size="11">● 3D NARRATIVE</text>
</svg>
