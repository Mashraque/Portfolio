<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#141e30"/>
    </linearGradient>
    <filter id="glow-3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-grad-3)"/>
  <!-- Distant Pagoda silhouette -->
  <path d="M 550 240 L 610 240 L 590 200 L 620 200 L 580 160 L 600 160 L 580 120 L 580 100 L 575 100 L 575 120 L 555 160 L 575 160 L 535 200 L 565 200 Z" fill="#0c192c" opacity="0.6"/>
  <!-- Neon Moon -->
  <circle cx="650" cy="120" r="60" fill="#00f5d4" opacity="0.2" filter="url(#glow-3)"/>
  <circle cx="650" cy="120" r="45" fill="#00f5d4" opacity="0.8"/>
  <!-- 2D Tilemap Platforms -->
  <rect x="80" y="340" width="220" height="30" rx="4" fill="#1b2838" stroke="#00f5d4" stroke-width="2"/>
  <rect x="360" y="270" width="160" height="24" rx="4" fill="#1b2838" stroke="#00f5d4" stroke-width="2"/>
  <rect x="580" y="210" width="160" height="24" rx="4" fill="#1b2838" stroke="#00f5d4" stroke-width="2"/>
  <!-- Collectible Coins (Glowing Orbs) -->
  <circle cx="410" cy="235" r="8" fill="#ffd166" filter="url(#glow-3)"/>
  <circle cx="440" cy="235" r="8" fill="#ffd166" filter="url(#glow-3)"/>
  <circle cx="470" cy="235" r="8" fill="#ffd166" filter="url(#glow-3)"/>
  <!-- Ninja Character (Mid-air dash / wall jump) -->
  <g transform="translate(230, 260)">
    <!-- Motion Trail -->
    <path d="M -40 20 Q -10 10 10 10" stroke="#00f5d4" stroke-width="6" stroke-linecap="round" opacity="0.4" filter="url(#glow-3)"/>
    <circle cx="20" cy="0" r="14" fill="#111" stroke="#00f5d4" stroke-width="2"/>
    <!-- Headband Ribbon -->
    <path d="M 8 -3 Q -20 -15 -35 -5" stroke="#f72585" stroke-width="4" stroke-linecap="round" filter="url(#glow-3)"/>
    <!-- Body & Sword -->
    <line x1="20" y1="14" x2="20" y2="45" stroke="#111" stroke-width="12" stroke-linecap="round"/>
    <line x1="30" y1="5" x2="65" y2="-15" stroke="#00f5d4" stroke-width="3" filter="url(#glow-3)"/>
  </g>
  <!-- HUD Details -->
  <rect x="30" y="30" width="160" height="34" rx="6" fill="#0b132b" stroke="#00f5d4" stroke-width="1.5"/>
  <text x="40" y="52" fill="#00f5d4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">SCORE: 12,450</text>
  <!-- Title Badge -->
  <rect x="230" y="400" width="340" height="32" rx="6" fill="#0b132b" fill-opacity="0.9" stroke="#00f5d4" stroke-width="1.5"/>
  <text x="400" y="422" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="2">SHADOW NINJA • 2D PLATFORMER</text>
</svg>
