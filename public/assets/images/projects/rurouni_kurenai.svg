<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mountainFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="mountainNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- Distant Moon -->
  <circle cx="650" cy="110" r="45" fill="#f8fafc" opacity="0.15"/>
  <circle cx="650" cy="110" r="40" fill="#cbd5e1" opacity="0.3"/>

  <!-- Parallax Layer 1: Distant Mountains -->
  <polygon points="0,320 160,210 320,290 480,180 640,280 800,200 800,450 0,450" fill="url(#mountainFar)"/>

  <!-- Parallax Layer 2: Midground Hills -->
  <polygon points="0,360 120,280 280,340 440,260 600,330 760,290 800,310 800,450 0,450" fill="url(#mountainNear)"/>

  <!-- Ground Platform Layer -->
  <rect x="0" y="380" width="800" height="70" fill="#020617"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#10b981" stroke-width="3" opacity="0.8"/>

  <!-- Floating Platforms -->
  <rect x="220" y="290" width="160" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <line x1="220" y1="290" x2="380" y2="290" stroke="#10b981" stroke-width="2" opacity="0.6"/>

  <rect x="460" y="230" width="140" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <line x1="460" y1="230" x2="600" y2="230" stroke="#10b981" stroke-width="2" opacity="0.6"/>

  <!-- 2D Player Character Silhouette (Kurenai) -->
  <g transform="translate(280, 230)">
    <!-- Scarf / Headband -->
    <path d="M-8,-25 Q-20,-20 -30,-30 Q-20,-15 -6,-20 Z" fill="#e11d48"/>
    <!-- Head -->
    <circle cx="0" cy="-25" r="10" fill="#f8fafc"/>
    <!-- Body -->
    <rect x="-7" y="-15" width="14" height="25" rx="3" fill="#38bdf8"/>
    <!-- Katana Blade -->
    <line x1="8" y1="-8" x2="30" y2="10" stroke="#f8fafc" stroke-width="2"/>
    <!-- Legs in action -->
    <line x1="-4" y1="10" x2="-8" y2="30" stroke="#f8fafc" stroke-width="3"/>
    <line x1="4" y1="10" x2="10" y2="30" stroke="#f8fafc" stroke-width="3"/>
  </g>

  <!-- Glowing Coins / Collectibles -->
  <g transform="translate(500, 195)">
    <circle cx="0" cy="0" r="10" fill="#f59e0b" filter="drop-shadow(0 0 8px #fbbf24)"/>
    <circle cx="0" cy="0" r="7" fill="#fbbf24"/>
    <text x="-4" y="4" fill="#78350f" font-family="monospace" font-size="10" font-weight="bold">$</text>
  </g>
  <g transform="translate(540, 195)">
    <circle cx="0" cy="0" r="10" fill="#f59e0b" filter="drop-shadow(0 0 8px #fbbf24)"/>
    <circle cx="0" cy="0" r="7" fill="#fbbf24"/>
    <text x="-4" y="4" fill="#78350f" font-family="monospace" font-size="10" font-weight="bold">$</text>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="40" width="220" height="34" rx="6" fill="#0f172a" stroke="#e11d48" stroke-width="1.5" opacity="0.9"/>
  <text x="65" y="62" fill="#f43f5e" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">RUROUNI KURENAI</text>
  <text x="280" y="62" fill="#94a3b8" font-family="monospace" font-size="11">● 2D PLATFORMER</text>
</svg>
