<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#03071e"/>
      <stop offset="60%" stop-color="#370617"/>
      <stop offset="100%" stop-color="#03071e"/>
    </linearGradient>
    <linearGradient id="track-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0054"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </linearGradient>
    <filter id="glow-4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-grad-4)"/>
  <!-- Perspective Cyber Highway -->
  <polygon points="380,180 420,180 780,450 20,450" fill="#10002b" stroke="#f72585" stroke-width="2"/>
  <line x1="400" y1="180" x2="400" y2="450" stroke="#ffd166" stroke-width="4" stroke-dasharray="25,20" filter="url(#glow-4)"/>
  <!-- Holographic Checkpoint Gates -->
  <ellipse cx="400" cy="240" rx="140" ry="60" fill="none" stroke="#4cc9f0" stroke-width="3" filter="url(#glow-4)"/>
  <ellipse cx="400" cy="210" rx="80" ry="35" fill="none" stroke="#4cc9f0" stroke-width="2" opacity="0.6"/>
  <!-- Cyber Racer Car (Rear View Drifting) -->
  <g transform="translate(350, 290)">
    <!-- Wheels & Drift Sparks -->
    <rect x="0" y="55" width="22" height="40" rx="6" fill="#111" stroke="#4cc9f0" stroke-width="2"/>
    <rect x="80" y="55" width="22" height="40" rx="6" fill="#111" stroke="#4cc9f0" stroke-width="2"/>
    <path d="M -10 90 L -50 110" stroke="#4cc9f0" stroke-width="4" filter="url(#glow-4)"/>
    <path d="M 110 90 L 150 110" stroke="#f72585" stroke-width="4" filter="url(#glow-4)"/>
    <!-- Car Body -->
    <polygon points="10,40 90,40 98,75 2,75" fill="#191923" stroke="#f72585" stroke-width="2"/>
    <polygon points="25,15 75,15 88,40 12,40" fill="#0d1b2a" stroke="#4cc9f0" stroke-width="2"/>
    <!-- Neon Tail Lights -->
    <rect x="15" y="50" width="70" height="8" rx="4" fill="#f72585" filter="url(#glow-4)"/>
    <rect x="40" y="25" width="20" height="5" rx="2" fill="#4cc9f0" filter="url(#glow-4)"/>
  </g>
  <!-- HUD Overlay -->
  <rect x="30" y="30" width="160" height="34" rx="6" fill="#03071e" stroke="#4cc9f0" stroke-width="1.5"/>
  <text x="40" y="52" fill="#4cc9f0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">SPEED: 284 KM/H</text>
  <rect x="610" y="30" width="160" height="34" rx="6" fill="#03071e" stroke="#f72585" stroke-width="1.5"/>
  <text x="630" y="52" fill="#f72585" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">LAP 2/3 [01:14.2]</text>
  <!-- Title Badge -->
  <rect x="230" y="400" width="340" height="32" rx="6" fill="#03071e" fill-opacity="0.9" stroke="#f72585" stroke-width="1.5"/>
  <text x="400" y="422" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="2">NEON DRIFT • MOBILE ARCADE</text>
</svg>
