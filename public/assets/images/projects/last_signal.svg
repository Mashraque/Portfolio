<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080e14"/>
      <stop offset="60%" stop-color="#142129"/>
      <stop offset="100%" stop-color="#050a0e"/>
    </linearGradient>
    <filter id="glow-5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-grad-5)"/>
  <!-- Sci-fi Corridor Perspective -->
  <polygon points="0,0 800,0 600,150 200,150" fill="#0f1922" stroke="#3a5a40" stroke-width="1"/>
  <polygon points="0,450 800,450 600,300 200,300" fill="#090f14" stroke="#3a5a40" stroke-width="1.5"/>
  <polygon points="0,0 200,150 200,300 0,450" fill="#132029" stroke="#588157" stroke-width="1.5"/>
  <polygon points="800,0 600,150 600,300 800,450" fill="#132029" stroke="#588157" stroke-width="1.5"/>
  <!-- Blast Door at end -->
  <rect x="250" y="160" width="300" height="130" fill="#1b263b" stroke="#e63946" stroke-width="2"/>
  <line x1="400" y1="160" x2="400" y2="290" stroke="#e63946" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- Red Emergency Light Beacon -->
  <circle cx="400" cy="180" r="14" fill="#e63946" filter="url(#glow-5)"/>
  <!-- Player Silhouette (Third person survivor with rifle/flashlight) -->
  <g transform="translate(320, 240)">
    <!-- Flashlight Beam -->
    <polygon points="70,55 350,-20 350,120" fill="#a8dadc" opacity="0.25" filter="url(#glow-5)"/>
    <ellipse cx="60" cy="60" rx="16" ry="24" fill="#1d3557"/>
    <circle cx="60" cy="25" r="14" fill="#1d3557" stroke="#457b9d" stroke-width="2"/>
  </g>
  <!-- Mini-map Radar in HUD -->
  <circle cx="720" cy="80" r="45" fill="#0b132b" fill-opacity="0.8" stroke="#52b788" stroke-width="1.5"/>
  <circle cx="720" cy="80" r="30" fill="none" stroke="#52b788" stroke-opacity="0.4" stroke-dasharray="2,2"/>
  <circle cx="720" cy="80" r="4" fill="#52b788"/>
  <circle cx="735" cy="65" r="5" fill="#e63946" filter="url(#glow-5)"/>
  <!-- HUD Status -->
  <rect x="30" y="30" width="180" height="34" rx="6" fill="#080e14" stroke="#e63946" stroke-width="1.5"/>
  <text x="40" y="52" fill="#e63946" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">BIO-CONTAINMENT BREACH</text>
  <!-- Title Badge -->
  <rect x="230" y="400" width="340" height="32" rx="6" fill="#080e14" fill-opacity="0.9" stroke="#e63946" stroke-width="1.5"/>
  <text x="400" y="422" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="2">LAST SIGNAL • 3RD PERSON SURVIVAL</text>
</svg>
