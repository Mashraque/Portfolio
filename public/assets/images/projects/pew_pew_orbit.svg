<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="planetGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <filter id="neonLaser" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGlow)"/>

  <!-- Stars / Cosmic dust -->
  <circle cx="120" cy="80" r="1.5" fill="#94a3b8" opacity="0.6"/>
  <circle cx="240" cy="140" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="680" cy="90" r="1.5" fill="#f8fafc" opacity="0.7"/>
  <circle cx="720" cy="320" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle cx="150" cy="380" r="1" fill="#94a3b8" opacity="0.4"/>
  <circle cx="580" cy="220" r="1.5" fill="#f8fafc" opacity="0.8"/>

  <!-- Orbital Ring (Dashed) -->
  <circle cx="400" cy="225" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Center Planet -->
  <circle cx="400" cy="225" r="75" fill="url(#planetGlow)" filter="drop-shadow(0 0 25px rgba(56, 189, 248, 0.4))"/>
  <!-- Planet Atmosphere Ring -->
  <circle cx="400" cy="225" r="79" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>

  <!-- Orbital Turret on the ring -->
  <g transform="translate(492, 133) rotate(45)">
    <!-- Turret Base -->
    <rect x="-10" y="-10" width="20" height="20" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#06b6d4"/>
    <!-- Turret Cannon -->
    <rect x="-3" y="-22" width="6" height="14" rx="2" fill="#06b6d4"/>
    <!-- Laser Beam -->
    <line x1="0" y1="-22" x2="0" y2="-120" stroke="#22d3ee" stroke-width="3" filter="url(#neonLaser)"/>
  </g>

  <!-- Incoming Asteroid Hazard -->
  <g transform="translate(560, 60)">
    <polygon points="0,15 12,0 30,8 35,28 20,40 5,32" fill="#334155" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="3" fill="#f43f5e" opacity="0.8"/>
  </g>

  <!-- Heat Indicator UI overlay mock -->
  <rect x="50" y="380" width="180" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="56" y="386" width="110" height="18" rx="4" fill="#06b6d4" opacity="0.85"/>
  <text x="70" y="399" fill="#030712" font-family="monospace" font-size="10" font-weight="bold">HEAT: 65%</text>

  <!-- Game Title Badge -->
  <rect x="50" y="40" width="190" height="34" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
  <text x="65" y="62" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">PEW PEW ORBIT</text>
  <text x="250" y="62" fill="#94a3b8" font-family="monospace" font-size="11">● PLAYABLE BETA</text>
</svg>
